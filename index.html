{id:'REG-2026-00128',patient:'P-000128',org:'RS Contoh Bahari',region:'Jawa Barat',tumor:'Kanker kolorektal',icd:'C18.9',topo:'C18.9',morph:'8140/3',stage:'III',date:'2026-05-27',status:'RETURNED_TO_FASKES',completeness:78,primary:'TUM-002',episode:'EOC-DEMO-128',timeline:['Dikembalikan untuk koreksi topografi']},
{id:'REG-2026-00129',patient:'P-000129',org:'RS Contoh Nusantara',region:'Jawa Tengah',tumor:'Kanker paru',icd:'C34.9',topo:'C34.9',morph:'8070/3',stage:'IV',date:'2026-08-09',status:'NATIONAL_REVIEW',completeness:98,primary:'TUM-003',episode:'EOC-DEMO-129',timeline:['ACC Regional','Diterima antrean nasional']},

];
var page='dashboard',step=0,selected=cards[0],role='nasional',search='',launchUrl='',launchCaseId='REG-2026-00130',sessionEvents=[];
function el(x){return document.getElementById(x)}function safe(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function log(s){sessionEvents.unshift({name:s,date:new Date().toLocaleString('id-ID'),role:role});}
function alertToast(s){el('toast').innerHTML='<div class="toast">'+safe(s)+'</div>';setTimeout(function(){el('toast').innerHTML=''},3300)}
function displayStatus(s){return ({DRAFT:'Draf registrasi',RETURNED_TO_FASKES:'Perlu perbaikan fasyankes',INTERNAL_RETURNED:'Dikembalikan verifikator RS',INTERNAL_VERIFICATION_PENDING:'Menunggu verifikasi RS',REGIONAL_REVIEW:'Sedang ditinjau daerah',NATIONAL_REVIEW:'Sedang ditinjau nasional',FINAL_LOCKED:'Registrasi final'})[s]||s.replaceAll('_',' ')}

function chart(vals){return vals.map(function(x){return '<div class="brow"><label>'+safe(x[0])+'</label><div class="bar"><span style="width:'+x[1]+'%"></span></div><strong>'+x[1]+'%</strong></div>'}).join('')}

function nav(){if(!menus[role].includes(page)&&!(presenterOpen&&techPages.includes(page)))page='dashboard';el('nav').innerHTML=navs.filter(function(n){return menus[role].includes(n[0])}).map(function(n){return '<button class="'+(page===n[0]?'active':'')+'" data-page="'+n[0]+'"><span class="ico">'+n[1]+'</span>'+n[2]+'</button>'}).join('');var item=navs.find(function(n){return n[0]===page})||navs[0];el('header-title').textContent=item[2];el('crumb').textContent=item[2];el('active-role').textContent=roles[role];document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=b.dataset.page;render()}})}
function presenterPanel(){return '<section class="presenter-panel"><div class="row"><h3>Kontrol Presenter</h3>'+button('Tutup Kontrol','hidepresenter','outline')+'</div><p class="tiny">Alat demonstrasi, bukan menu pengguna Portal Registri.</p><div class="presenter-row"><div class="field"><label>Peran simulasi</label><select id="role" class="select" style="width:100%">'+Object.keys(roles).map(function(k){return '<option value="'+k+'"'+(k===role?' selected':'')+'>'+roles[k]+'</option>'}).join('')+'</select></div><div class="field"><label>Konteks kasus</label><div class="hint">'+safe(selected.id)+' · '+safe(selected.org)+' · '+safe(selected.region)+'</div></div></div><div class="presenter-row" style="margin-top:14px">'+button('Simulasi Launch SIMRS','presenterlaunch','primary')+button('Integrasi & Audit','presentermonitor','outline')+button('Konfigurasi','presenteradmin','outline')+button('Reset Demo','reset','outline')+'</div><p class="tiny" style="margin-top:10px">Seluruh proses dan data hanya contoh, tanpa koneksi ke sistem nyata.</p></section>'}
function dashboard(){var list=scopedCases(),total=list.length,stages=[['Draf / koreksi',list.filter(function(c){return ['DRAFT','RETURNED_TO_FASKES','INTERNAL_RETURNED'].includes(c.status)}).length],['Verifikasi RS',list.filter(function(c){return c.status==='INTERNAL_VERIFICATION_PENDING'}).length],['Review daerah',list.filter(function(c){return c.status==='REGIONAL_REVIEW'}).length],['Review nasional',list.filter(function(c){return c.status==='NATIONAL_REVIEW'}).length],['Registrasi final',list.filter(function(c){return c.status==='FINAL_LOCKED'}).length]];
